<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

<body>
    <div id="sidebar"></div>

            <button id = "phaseConfirmation">Update Visualization</button>
            <div id="tooltip-box"></div>
        </div>
    </div>
    <!-- Existing phase selection -->
<select id="phaseDropDown"></select>
<button id="phaseConfirmation">Update Visualization</button>

<!-- New: Visualization type toggle -->
<button id="visTypeToggle">
    Switch to <span id="currentVisType">Force-Directed</span> View
</button>
<script src="https://d3js.org/d3.v7.min.js"></script>
