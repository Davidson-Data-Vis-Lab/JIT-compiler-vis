<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Visualizer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainFlexBox">
        <div id="chart-area"></div>

        <div id="SidebarFlex">
            <label for="phaseDropDown">Select phase:</label>
            <select name="phase" id="phaseDropDown"></select>
            <button id="phaseConfirmation">Update Visualization</button>
            <button id="visTypeToggle">Switch to <span id="currentVisType">Force-Directed</span> View</button>
            <div id="tooltip-box"></div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="static.js"></script>
    <script src="forcedirected.js"></script>
    <script src="buttons.js"></script>
    <script src="tooltip.js"></script>
</body>
</html>
